---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable daily package list refresh and unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"

- name: Set explicit origins and reboot policy
  ansible.builtin.template:
    src: 52provisionkit-unattended.conf.j2
    dest: /etc/apt/apt.conf.d/52provisionkit-unattended.conf
    owner: root
    group: root
    mode: "0644"

- name: Enable apt timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: [apt-daily.timer, apt-daily-upgrade.timer]

- name: Read effective origins
  when: not ansible_check_mode
  ansible.builtin.command: apt-config dump Unattended-Upgrade::Allowed-Origins
  register: automatic_updates_origins
  changed_when: false

- name: Assert security-only origins
  when: not ansible_check_mode
  ansible.builtin.assert:
    that:
      - "'-security' in automatic_updates_origins.stdout"
      - "'-updates' not in automatic_updates_origins.stdout"
      - "'-backports' not in automatic_updates_origins.stdout"

- name: Dry-run unattended upgrade
  when: not ansible_check_mode
  ansible.builtin.command: unattended-upgrade --dry-run
  changed_when: false
