---
- name: Assert the settings are valid
  ansible.builtin.assert:
    that:
      - nightly_reboot_time is match('^([01][0-9]|2[0-3]):[0-5][0-9]$')
      - nightly_reboot_max_wait_minutes | int > 0
      - nightly_reboot_max_wait_minutes | int <= 240
    fail_msg: "provisionkit_nightly_reboot_time must look like 00:00 and the wait must be 1 to 240 minutes."
    quiet: true

- name: Make the time zone explicit
  when: nightly_reboot_timezone | length > 0
  block:
    - name: Look the time zone up in the system database
      ansible.builtin.stat:
        path: "/usr/share/zoneinfo/{{ nightly_reboot_timezone }}"
      register: nightly_reboot_zone
      when: nightly_reboot_timezone is match('^[A-Za-z0-9_+-]+(/[A-Za-z0-9_+-]+){0,2}$')

    - name: Assert the time zone name exists
      ansible.builtin.assert:
        that:
          - nightly_reboot_timezone is match('^[A-Za-z0-9_+-]+(/[A-Za-z0-9_+-]+){0,2}$')
          - nightly_reboot_zone.stat.isreg | default(false)
        fail_msg: "'{{ nightly_reboot_timezone }}' is not a time zone name. Try America/New_York or Europe/London."
        quiet: true

    - name: Read the current time zone
      ansible.builtin.command: timedatectl show -p Timezone --value
      register: nightly_reboot_current
      changed_when: false
      check_mode: false

    - name: Set the time zone
      ansible.builtin.command: "timedatectl set-timezone {{ nightly_reboot_timezone | quote }}"
      when: nightly_reboot_current.stdout | trim != nightly_reboot_timezone
      changed_when: true

- name: Install the nightly reboot
  when: nightly_reboot_enabled | bool
  block:
    - name: Install the reboot script
      ansible.builtin.copy:
        src: provisionkit-nightly-reboot
        dest: /usr/local/sbin/provisionkit-nightly-reboot
        owner: root
        group: root
        mode: "0755"

    - name: Install the service and the timer
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop: [pk-nightly-reboot.service, pk-nightly-reboot.timer]
      notify:
        - Reload systemd for the nightly reboot
        - Restart the nightly reboot timer

    - name: Apply handlers now so the timer is current before it is enabled
      ansible.builtin.meta: flush_handlers

    - name: Enable the timer
      ansible.builtin.systemd:
        name: pk-nightly-reboot.timer
        enabled: true
        state: started
      when: not ansible_check_mode

- name: Remove the nightly reboot
  when: not (nightly_reboot_enabled | bool)
  block:
    - name: Check whether the timer is installed
      ansible.builtin.stat:
        path: /etc/systemd/system/pk-nightly-reboot.timer
      register: nightly_reboot_installed

    - name: Stop and disable the timer
      ansible.builtin.systemd:
        name: pk-nightly-reboot.timer
        enabled: false
        state: stopped
      when: nightly_reboot_installed.stat.exists and not ansible_check_mode

    - name: Remove the files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/pk-nightly-reboot.timer
        - /etc/systemd/system/pk-nightly-reboot.service
        - /usr/local/sbin/provisionkit-nightly-reboot
      notify: Reload systemd for the nightly reboot
