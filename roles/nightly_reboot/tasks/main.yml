---
- name: Assert the settings are valid
  ansible.builtin.assert:
    that:
      - nightly_reboot_time is match('^([01][0-9]|2[0-3]):[0-5][0-9]$')
      - nightly_reboot_max_wait_minutes | int > 0
      - nightly_reboot_max_wait_minutes | int <= 240
    fail_msg: "provisionkit_nightly_reboot_time must look like 00:00 and the wait must be 1 to 240 minutes."
    quiet: true

- name: Install the nightly reboot
  when: nightly_reboot_enabled | bool
  block:
    - name: Install the reboot script
      ansible.builtin.copy:
        src: provisionkit-nightly-reboot
        dest: /usr/local/sbin/provisionkit-nightly-reboot
        owner: root
        group: root
        mode: "0755"

    - name: Install the service and the timer
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop: [pk-nightly-reboot.service, pk-nightly-reboot.timer]
      notify:
        - Reload systemd for the nightly reboot
        - Restart the nightly reboot timer

    - name: Apply handlers now so the timer is current before it is enabled
      ansible.builtin.meta: flush_handlers

    - name: Enable the timer
      ansible.builtin.systemd:
        name: pk-nightly-reboot.timer
        enabled: true
        state: started
      when: not ansible_check_mode

- name: Remove the nightly reboot
  when: not (nightly_reboot_enabled | bool)
  block:
    - name: Check whether the timer is installed
      ansible.builtin.stat:
        path: /etc/systemd/system/pk-nightly-reboot.timer
      register: nightly_reboot_installed

    - name: Stop and disable the timer
      ansible.builtin.systemd:
        name: pk-nightly-reboot.timer
        enabled: false
        state: stopped
      when: nightly_reboot_installed.stat.exists and not ansible_check_mode

    - name: Remove the files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/pk-nightly-reboot.timer
        - /etc/systemd/system/pk-nightly-reboot.service
        - /usr/local/sbin/provisionkit-nightly-reboot
      notify: Reload systemd for the nightly reboot
