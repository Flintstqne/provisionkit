---
# Read-only acceptance checks. Changes nothing; fails on any mismatch.
#   ansible-playbook playbooks/validate.yml --limit pk-worker
- name: Validate baseline
  hosts: workload_nodes
  become: true
  vars:
    ansible_user: "{{ provisionkit_deploy_user }}"
    ansible_ssh_private_key_file: "{{ provisionkit_deploy_key_file }}"
    ansible_ssh_common_args: "-o IdentitiesOnly=yes"
  tasks:
    - name: Read effective sshd settings
      ansible.builtin.command: sshd -T
      register: validate_sshd
      changed_when: false

    - name: Read time sync state
      ansible.builtin.command: timedatectl show -p NTPSynchronized --value
      register: validate_ntp
      changed_when: false

    - name: Read loaded audit rules
      ansible.builtin.command: auditctl -l
      register: validate_audit
      changed_when: false

    - name: Read unattended-upgrade origins
      ansible.builtin.command: apt-config dump Unattended-Upgrade::Allowed-Origins
      register: validate_origins
      changed_when: false

    - name: Read ufw status
      ansible.builtin.command: ufw status verbose
      register: validate_ufw
      changed_when: false

    - name: Read admin group membership
      ansible.builtin.command: "id -nG {{ item.name }}"
      loop: "{{ provisionkit_admin_users }}"
      loop_control:
        label: "{{ item.name }}"
      register: validate_groups
      changed_when: false

    - name: Stat sensitive files and journal
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/sudoers.d/90-provisionkit
        - "/home/{{ provisionkit_deploy_user }}/.ssh/authorized_keys"
        - /var/log/journal
        - /var/run/reboot-required
      register: validate_stat

    - name: Read baseline manifest
      ansible.builtin.slurp:
        src: /etc/provisionkit/baseline.json
      register: validate_manifest_raw

    - name: Read unit state (no state argument, so read-only)
      ansible.builtin.systemd:
        name: "{{ item }}"
      loop: [apt-daily.timer, apt-daily-upgrade.timer, auditd.service, ssh.socket, ssh.service]
      register: validate_units

    - name: Assert baseline state
      ansible.builtin.assert:
        that:
          - ansible_hostname == inventory_hostname
          - "'passwordauthentication no' in validate_sshd.stdout_lines"
          - "'kbdinteractiveauthentication no' in validate_sshd.stdout_lines"
          - "'permitrootlogin no' in validate_sshd.stdout_lines"
          - validate_ntp.stdout == 'yes'
          - "'-security' in validate_origins.stdout and '-updates' not in validate_origins.stdout"
          - validate_stat.results[0].stat.mode == '0440'
          - validate_stat.results[0].stat.pw_name == 'root'
          - validate_stat.results[1].stat.mode == '0600'
          - validate_stat.results[1].stat.pw_name == provisionkit_deploy_user
          - validate_stat.results[2].stat.isdir | default(false)
        quiet: true

    - name: Assert baseline manifest matches this node
      ansible.builtin.assert:
        that:
          - validate_manifest.schema_version == 1
          - validate_manifest.node_id == inventory_hostname
          - validate_manifest.configuration_commit | length >= 40
          - "'-dirty' not in validate_manifest.configuration_commit"
          - validate_manifest.expected_services | length > 0
        quiet: true
      vars:
        validate_manifest: "{{ validate_manifest_raw.content | b64decode | from_json }}"

    - name: Read the nightly reboot timer
      ansible.builtin.systemd:
        name: pk-nightly-reboot.timer
      register: validate_reboot_timer
      when: provisionkit_nightly_reboot | default(false) | bool

    - name: Read the time zone
      ansible.builtin.command: timedatectl show -p Timezone --value
      register: validate_timezone
      changed_when: false

    - name: Assert the nightly reboot is scheduled
      ansible.builtin.assert:
        that:
          - validate_reboot_timer.status.UnitFileState == 'enabled'
          - validate_reboot_timer.status.ActiveState == 'active'
        fail_msg: "{{ inventory_hostname }}: nightly reboot is wanted but the timer is not enabled and active."
        quiet: true
      when: provisionkit_nightly_reboot | default(false) | bool

    - name: Assert the time zone is the declared one
      ansible.builtin.assert:
        that: validate_timezone.stdout | trim == (provisionkit_timezone | default('America/New_York'))
        fail_msg: >-
          {{ inventory_hostname }}: time zone is {{ validate_timezone.stdout | trim }},
          expected {{ provisionkit_timezone | default('America/New_York') }}.
        quiet: true

    - name: Assert admin accounts have sudo
      ansible.builtin.assert:
        that: "'sudo' in item.stdout.split()"
        quiet: true
      loop: "{{ validate_groups.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Assert units are enabled
      ansible.builtin.assert:
        # Ubuntu 24.04 starts sshd through ssh.socket, so ssh.service is only required to be active.
        that: >-
          item.status.ActiveState == 'active'
          if item.item == 'ssh.service' else item.status.UnitFileState == 'enabled'
        quiet: true
      loop: "{{ validate_units.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Assert audit rules are loaded
      ansible.builtin.assert:
        that: "item in validate_audit.stdout"
        quiet: true
      loop: [provisionkit-identity, provisionkit-sudo, provisionkit-ssh, provisionkit-managed]

    - name: Assert firewall is enforcing (once applied)
      ansible.builtin.assert:
        that:
          - "'Status: active' in validate_ufw.stdout"
          - "'deny (incoming)' in validate_ufw.stdout"
        quiet: true
      when: provisionkit_firewall_applied | default(false)

    - name: Report pending reboot
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: REBOOT REQUIRED"
      when: validate_stat.results[3].stat.exists

    - name: Summary
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: baseline checks passed; firewall {{ validate_fw_note }}"
      vars:
        validate_fw_note: "{{ 'verified' if provisionkit_firewall_applied | default(false) else 'NOT checked' }}"
