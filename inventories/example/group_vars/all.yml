---
provisionkit_environment: lab
provisionkit_deploy_user: provisionkit
provisionkit_ssh_port: 22
provisionkit_network_profile: standalone
provisionkit_automatic_reboot: false
provisionkit_k3s_enabled: false
provisionkit_management_sources:
  - 192.0.2.10/32  # controller (example)
  - 192.0.2.40/32  # admin workstation (example)
provisionkit_deploy_public_key: "ssh-ed25519 AAAA...replace-in-local-inventory provisionkit-deploy"
provisionkit_deploy_key_file: /home/provisionkit/.ssh/provisionkit_ed25519
provisionkit_admin_users:
  - name: admin
    ssh_keys: ["ssh-ed25519 AAAA...replace-in-local-inventory admin"]
# Set true once the firewall role has been applied, so validate.yml checks ufw.
provisionkit_firewall_applied: false
